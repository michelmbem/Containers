services:
  firebird:
    image: firebirdsql/firebird:5.0.4
    container_name: firebird
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3050"
    environment:
      FIREBIRD_ROOT_PASSWORD: "${FIREBIRD_ROOT_PASSWORD:-FirebirdAdm1n!}"
      FIREBIRD_DATABASE: employee.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    volumes:
      - firebird_data:/var/lib/firebird/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
      - ./samples/employee.fdb:/samples/employee.fdb:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'isql -user SYSDBA -password "$$FIREBIRD_ROOT_PASSWORD" -q "localhost:/var/lib/firebird/data/employee.fdb" < /dev/null >/dev/null 2>&1'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  dbgate-firebird:
    image: dbgate/dbgate:latest
    container_name: dbgate-firebird
    restart: unless-stopped
    depends_on:
      firebird:
        condition: service_healthy
    ports:
      - "127.0.0.1:3102:3000"
    volumes:
      - dbgate_firebird_data:/root/.dbgate
    environment:
      CONNECTIONS: firebird
      LABEL_firebird: Firebird
      SERVER_firebird: firebird
      PORT_firebird: 3050
      DATABASE_firebird: /var/lib/firebird/data/employee.fdb
      USER_firebird: SYSDBA
      PASSWORD_firebird: "${FIREBIRD_ROOT_PASSWORD:-FirebirdAdm1n!}"
      ENGINE_firebird: firebird@dbgate-plugin-firebird

volumes:
  firebird_data:
  dbgate_firebird_data:
