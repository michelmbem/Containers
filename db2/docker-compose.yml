services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: db2
    hostname: db2
    platform: linux/amd64
    privileged: true
    restart: unless-stopped
    shm_size: 1g
    ports:
      - "127.0.0.1:50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2INST1_PASSWORD:-Db2DevAdm1n!}
      DBNAME: ROASTERY
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      PERSISTENT_HOME: "true"
      HADR_ENABLED: "false"
    volumes:
      - db2_data:/database
    healthcheck:
      test:
        - CMD-SHELL
        - su - db2inst1 -c 'db2 connect to ROASTERY' >/dev/null 2>&1
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 5m

  install-samples:
    image: icr.io/db2_community/db2:latest
    container_name: db2-install-samples
    platform: linux/amd64
    restart: "no"
    depends_on:
      db2:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/install-roastery.sh"]
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2INST1_PASSWORD:-Db2DevAdm1n!}
    volumes:
      - db2_data:/database
      - ./scripts:/scripts:ro
      - db2_sample_state:/state

volumes:
  db2_data:
  db2_sample_state:
