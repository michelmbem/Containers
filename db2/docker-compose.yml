services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: db2
    hostname: db2
    platform: linux/amd64
    privileged: true
    restart: unless-stopped
    shm_size: 1g
    ports:
      - "127.0.0.1:50000:50000"
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: ${DB2INST1_PASSWORD:-Db2DevAdm1n!}
      DBNAME: ROASTERY
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      UPDATEAVAIL: "NO"
      TO_CREATE_SAMPLEDB: "false"
      REPODB: "false"
      PERSISTENT_HOME: "true"
      HADR_ENABLED: "false"
    volumes:
      - db2_data:/database
      - db2_sample_state:/state
      - ./scripts:/scripts:ro
      - ./custom:/var/custom:ro
    healthcheck:
      test:
        - CMD-SHELL
        - su - db2inst1 -c 'db2 connect to ROASTERY' >/dev/null 2>&1
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 5m

  cloudbeaver-db2:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver-db2
    restart: unless-stopped
    depends_on:
      db2:
        condition: service_healthy
    ports:
      - "127.0.0.1:3103:8978"
    volumes:
      - cloudbeaver_db2_data:/opt/cloudbeaver/workspace
      - ./cloudbeaver/data-sources.json:/opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources.json

volumes:
  db2_data:
  db2_sample_state:
  cloudbeaver_db2_data:
