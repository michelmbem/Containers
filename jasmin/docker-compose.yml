x-panel-env: &panel-env
  DJANGO_SETTINGS_MODULE: config.settings.pro
  DEBUG: "False"
  REDIS_HOST: redis
  TELNET_HOST: jasmin
  TELNET_PORT: 8990
  TELNET_USERNAME: jcliadmin
  TELNET_PW: jclipwd
  SMPP_HOST: jasmin
  SMPP_PORT: 2775
  HTTP_HOST: http://jasmin
  HTTP_PORT: 1401

services:
  jasmin:
    image: jookies/jasmin:latest
    container_name: jasmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:2775:2775"
      - "127.0.0.1:8990:8990"
      - "127.0.0.1:1401:1401"
    environment:
      REDIS_CLIENT_HOST: redis
      AMQP_BROKER_HOST: rabbitmq
      AMQP_BROKER_PORT: 5672
    volumes:
      - jasmin_config:/etc/jasmin
      - jasmin_logs:/var/log/jasmin
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  jasmin-web:
    image: tarekaec/jasmin_web_panel:latest
    container_name: jasmin-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8999:8000"
    environment:
      <<: *panel-env
      SECRET_KEY: ${JASMIN_PANEL_SECRET_KEY:-replace-this-local-development-secret}
      ALLOWED_HOSTS: "*"
      POSTGRES_DB: jasmin
      POSTGRES_USER: jasmin
      POSTGRES_PASSWORD: ${JASMIN_PANEL_DB_PASSWORD:-jasmin}
      PRODB_URL: postgres://jasmin:${JASMIN_PANEL_DB_PASSWORD:-jasmin}@db:5432/jasmin
      REDIS_PORT: 6379
      REDIS_DB: 0
      SUBMIT_LOG: "False"
    volumes:
      - web_public:/app/public
      - web_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jasmin:
        condition: service_started

  jasmin-celery:
    image: tarekaec/jasmin_web_panel:latest
    container_name: jasmin-celery
    restart: unless-stopped
    entrypoint: bash ./docker-entrypoint-celery.sh
    environment:
      <<: *panel-env
      SECRET_KEY: ${JASMIN_PANEL_SECRET_KEY:-replace-this-local-development-secret}
      ALLOWED_HOSTS: "*"
      POSTGRES_DB: jasmin
      POSTGRES_USER: jasmin
      POSTGRES_PASSWORD: ${JASMIN_PANEL_DB_PASSWORD:-jasmin}
      PRODB_URL: postgres://jasmin:${JASMIN_PANEL_DB_PASSWORD:-jasmin}@db:5432/jasmin
      REDIS_PORT: 6379
      REDIS_DB: 0
      SUBMIT_LOG: "False"
      CELERY_LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      jasmin:
        condition: service_started

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: jasmin-rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: jasmin-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17
    container_name: jasmin-web-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: jasmin
      POSTGRES_USER: jasmin
      POSTGRES_PASSWORD: ${JASMIN_PANEL_DB_PASSWORD:-jasmin}
    volumes:
      - panel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jasmin -d jasmin"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  jasmin_config:
  jasmin_logs:
  rabbitmq_data:
  redis_data:
  panel_db_data:
  web_public:
  web_logs:
