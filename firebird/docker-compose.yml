services:
  firebird:
    image: firebirdsql/firebird:5.0.4
    container_name: firebird
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3050"
    environment:
      FIREBIRD_ROOT_PASSWORD: "${FIREBIRD_ROOT_PASSWORD:-FirebirdAdm1n!}"
      FIREBIRD_DATABASE: employee.fdb
      FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
    volumes:
      - firebird_data:/var/lib/firebird/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
      - ./samples/employee.fdb:/samples/employee.fdb:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'isql -user SYSDBA -password "$$FIREBIRD_ROOT_PASSWORD" -q "localhost:/var/lib/firebird/data/employee.fdb" < /dev/null >/dev/null 2>&1'
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  cloudbeaver-firebird:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver-firebird
    restart: unless-stopped
    depends_on:
      firebird:
        condition: service_healthy
    ports:
      - "127.0.0.1:3102:8978"
    volumes:
      - cloudbeaver_firebird_data:/opt/cloudbeaver/workspace
      - ./cloudbeaver/data-sources.json:/opt/cloudbeaver/workspace/GlobalConfiguration/.dbeaver/data-sources.json

volumes:
  firebird_data:
  cloudbeaver_firebird_data:
